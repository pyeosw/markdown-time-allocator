name: Test extension
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        with:
          name: time-calculator-vsix
          path: artifacts/*.vsix
